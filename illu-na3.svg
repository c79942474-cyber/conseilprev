<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img"
     aria-labelledby="t3 d3" preserveAspectRatio="xMidYMid meet">
  <title id="t3">La conformité ne dit pas la dépendance</title>
  <desc id="d3">Un nuage documenté et conforme reste hors de portée : la
  question posée n'est plus « mon système est-il conforme » mais « que se
  passe-t-il si mon fournisseur s'arrête ».</desc>
  <!-- Le nuage : documenté, étiqueté, conforme — et la clé n'est pas dedans. -->
  <path d="M232 186c-34 0-60-24-60-54s26-54 60-54c10-30 38-50 72-50 42 0 78 30 84 70
           28 4 48 26 48 52 0 30-26 54-60 54z" fill="rgba(255,255,255,.03)"
        stroke="rgba(240,236,255,.5)" stroke-width="2"/>
  <g fill="none" stroke="#e6c65a" stroke-width="1.8">
    <circle cx="300" cy="86" r="4"/><circle cx="336" cy="94" r="4"/>
    <circle cx="360" cy="120" r="4"/><circle cx="360" cy="156" r="4"/>
    <circle cx="336" cy="182" r="4"/><circle cx="300" cy="190" r="4"/>
    <circle cx="264" cy="182" r="4"/><circle cx="240" cy="156" r="4"/>
    <circle cx="240" cy="120" r="4"/><circle cx="264" cy="94" r="4"/>
  </g>
  <text x="300" y="144" fill="rgba(240,236,255,.8)" font-family="Georgia,serif"
        font-size="15" text-anchor="middle">documenté</text>
  <text x="300" y="234" fill="rgba(240,236,255,.6)" font-family="Georgia,serif"
        font-size="13" text-anchor="middle">ce que le règlement corrige</text>
  <!-- La clé, hors du nuage : la continuité, la portabilité, l'infrastructure. -->
  <circle cx="576" cy="118" r="26" fill="none" stroke="rgba(240,236,255,.75)"
          stroke-width="2.5"/>
  <path d="M576 144v66M576 186h26M576 166h20" stroke="rgba(240,236,255,.75)"
        stroke-width="2.5" stroke-linecap="round"/>
  <text x="612" y="234" fill="rgba(240,236,255,.6)" font-family="Georgia,serif"
        font-size="13" text-anchor="middle">ce qu'il ne garantit pas</text>
  <path d="M420 148h96" stroke="rgba(240,236,255,.32)" stroke-width="2"
        stroke-dasharray="6 6"/>
  <text x="468" y="136" fill="rgba(240,236,255,.5)" font-family="Georgia,serif"
        font-size="12.5" text-anchor="middle">?</text>
</svg>
