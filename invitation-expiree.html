<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lien expiré — Sentinel AI</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F2ED;--white:#FFFFFF;--ink:#1C1C1C;--ink2:#3D3D3D;--muted:#767676;--rule:#E0DDD8;--accent:#B83222;--serif:'Instrument Serif',Georgia,serif;--sans:'Inter',system-ui,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:44px 40px;width:100%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,.06);text-align:center}
.logo{font-family:var(--serif);font-size:26px;color:var(--ink);margin-bottom:4px}
.logo .ai{display:inline-block;background:var(--accent);color:#fff;font-family:monospace;font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;margin-left:4px;vertical-align:middle}
p{font-size:13px;color:var(--ink2);line-height:1.6;margin-top:18px}
a{color:var(--accent);text-decoration:none;font-weight:600}
</style>
<link rel="stylesheet" href="/anti-debordement.css">
</head>
<body>
  <div class="box">
    <div class="logo">Sentinel <span class="ai">AI</span></div>
    <p>Ce lien d'activation est invalide ou a expiré (validité 48 heures, usage unique).</p>
    <p>Contactez <a href="mailto:christophe.cerf@outlook.com">CONSEILPREV</a> pour recevoir un nouveau lien d'activation.</p>
  </div>
</body>
</html>
