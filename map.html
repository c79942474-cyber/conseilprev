<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body,#map{width:100%;height:100vh}
.leaflet-popup-content{font-family:Inter,sans-serif;min-width:200px}
.pn{font-size:13px;font-weight:600;color:#1C1C1C;margin-bottom:4px}
.pr{font-size:11px;color:#767676;line-height:1.4;margin-bottom:8px}
.ps{font-family:Georgia,serif;font-size:22px;line-height:1}
.pl{font-size:9px;font-family:monospace;letter-spacing:.1em;color:#A8A8A8;text-transform:uppercase;margin-top:2px}
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var map = L.map('map',{center:[25,15],zoom:2,minZoom:2,maxZoom:7,scrollWheelZoom:false});
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
  subdomains:'abcd',maxZoom:19
}).addTo(map);

var GEO = [
  {n:'Union européenne',   r:'EU AI Act — Règlement 2024/1689',              s:9.2, lat:50.5, lng:15.0},
  {n:'Allemagne',          r:'AI Act + AI Strategy Update 2023',              s:8.8, lat:51.2, lng:10.4},
  {n:'France',             r:'AI Act + Stratégie nationale IA + CNIL',        s:8.5, lat:46.2, lng:2.2},
  {n:'Chine',              r:'Generative AI Measures + Algorithm Regulations', s:8.0, lat:35.8, lng:104.2},
  {n:'Russie',             r:'National AI Strategy + Digital Code',            s:7.5, lat:61.5, lng:90.0},
  {n:'Corée du Sud',       r:'AI Basic Act (2025)',                            s:7.0, lat:36.0, lng:127.9},
  {n:'Canada',             r:'AIDA — AI & Data Act',                          s:6.5, lat:56.1, lng:-106.3},
  {n:'Suisse',             r:'Convention-cadre IA + LPD révisée',             s:6.5, lat:46.8, lng:8.2},
  {n:'Brésil',             r:'PL 2338/2023 + LGPD',                           s:6.0, lat:-14.2,lng:-51.9},
  {n:'Royaume-Uni',        r:'AI Regulation White Paper 2023',                s:5.5, lat:54.0, lng:-2.5},
  {n:'Turquie',            r:'National AI Strategy 2021-2025 + KVKK',         s:5.5, lat:38.9, lng:35.2},
  {n:'Australie',          r:'AI Ethics Framework + Mandatory Guardrails',    s:5.5, lat:-25.3,lng:133.8},
  {n:'Chili',              r:'National AI Policy + projet loi IA 2024',       s:5.0, lat:-35.7,lng:-71.5},
  {n:'Israël',             r:'Policy on AI Regulation (2023)',                 s:5.0, lat:31.5, lng:35.0},
  {n:'Singapour',          r:'Model AI Governance Framework + AI Verify',     s:5.0, lat:1.35, lng:103.8},
  {n:'Inde',               r:'Digital India Act + DPDP Act',                  s:4.5, lat:20.6, lng:78.9},
  {n:'Malaisie',           r:'National AI Roadmap 2021-2025 + PDPA',          s:4.5, lat:4.2,  lng:108.5},
  {n:'États-Unis',         r:'NIST AI RMF + Executive Orders + State laws',   s:4.5, lat:39.5, lng:-98.4},
  {n:'Émirats Arabes Unis',r:'UAE AI Strategy 2031 + AI Charter',             s:4.0, lat:23.4, lng:53.8},
  {n:'Japon',              r:'AI Guidelines for Business + Hiroshima Process', s:4.0, lat:36.2, lng:138.2},
  {n:'Argentine',          r:'Recommandation éthique IA + Loi 25.326',        s:4.0, lat:-34.0,lng:-64.0},
  {n:'Mexique',            r:'Aucun cadre spécifique — initiatives sectorielles',s:3.5,lat:23.6,lng:-102.6},
  {n:'Afrique du Sud',     r:'National AI Plan (draft) + POPIA',              s:3.5, lat:-28.5,lng:24.7},
  {n:'Nigéria',            r:'National AI Strategy (draft 2024) + NDPA',      s:2.5, lat:9.1,  lng:8.7},
];

function c(s){return s>=8?'#B83222':s>=5?'#C47C1A':'#2D7A47';}

GEO.forEach(function(g){
  var mk=L.circleMarker([g.lat,g.lng],{
    radius:6+g.s*1.1, fillColor:c(g.s),
    color:'#fff', weight:1.5, fillOpacity:0.85
  }).addTo(map);
  var lbl=g.s>=8?'Très strict':g.s>=5?'Modéré':'Souple';
  mk.bindPopup(
    '<div class="pn">'+g.n+'</div>'
    +'<div class="pr">'+g.r+'</div>'
    +'<div class="ps" style="color:'+c(g.s)+'">'+g.s
    +'<span style="font-size:12px;color:#A8A8A8">/10</span></div>'
    +'<div class="pl">'+lbl+'</div>',
    {maxWidth:250}
  );
});
</script>
</body>
</html>
