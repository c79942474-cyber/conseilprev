<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body,#map{width:100%;height:100vh}
.leaflet-popup-content{font-family:Inter,sans-serif;min-width:190px}
.pn{font-size:13px;font-weight:600;color:#1C1C1C;margin-bottom:4px}
.pr{font-size:11px;color:#767676;line-height:1.4;margin-bottom:8px}
.ps{font-family:Georgia,serif;font-size:22px;line-height:1}
.pl{font-size:9px;font-family:monospace;letter-spacing:.1em;color:#A8A8A8;text-transform:uppercase;margin-top:2px}
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var map = L.map('map', {center:[25,15], zoom:2, minZoom:2, maxZoom:7, scrollWheelZoom:false});

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

var GEO = [
  {n:'Union européenne',   r:'EU AI Act 2024/1689',              s:9.2, lat:50.5,  lng:15.0},
  {n:'France',             r:'EU AI Act + CNIL',                 s:9.0, lat:46.2,  lng:2.2},
  {n:'Allemagne',          r:'EU AI Act + BfDI',                 s:9.0, lat:51.2,  lng:10.4},
  {n:'Chine',              r:'CAC Deep Synthesis Rules 2023',    s:8.8, lat:35.8,  lng:104.2},
  {n:'Israël',             r:'Policy on AI Regulation 2023',     s:8.5, lat:31.5,  lng:35.0},
  {n:'Suisse',             r:'LPD révisée + Convention IA',      s:8.0, lat:46.8,  lng:8.2},
  {n:'Royaume-Uni',        r:'AI Governance Framework 2024',     s:7.4, lat:54.0,  lng:-2.5},
  {n:'États-Unis',         r:'EO 14110 — Safe AI',               s:6.6, lat:39.5,  lng:-98.4},
  {n:'Russie',             r:'National AI Strategy 2030',        s:5.5, lat:61.5,  lng:90.0},
  {n:'Japon',              r:'AI Strategy Council Guidelines',   s:5.8, lat:36.2,  lng:138.2},
  {n:'Corée du Sud',       r:'AI Industry Promotion Act',        s:5.6, lat:36.0,  lng:127.9},
  {n:'Canada',             r:'AIDA — AI & Data Act',             s:5.2, lat:56.1,  lng:-106.3},
  {n:'Arabie Saoudite',    r:'National AI Strategy SDAIA',       s:5.0, lat:23.9,  lng:45.1},
  {n:'Brésil',             r:'PL 2338/2023',                     s:4.8, lat:-14.2, lng:-51.9},
  {n:'Singapour',          r:'AI Governance Framework v2',       s:4.4, lat:1.35,  lng:103.8},
  {n:'Émirats Arabes Unis',r:'UAE AI Strategy 2031',             s:4.0, lat:23.4,  lng:53.8},
  {n:'Argentine',          r:'Recommandation éthique + L.25.326',s:4.0, lat:-34.0, lng:-64.0},
  {n:'Inde',               r:'MEITY AI Principles 2023',         s:3.8, lat:20.6,  lng:78.9},
  {n:'Australie',          r:'AI Ethics Framework CSIRO',        s:3.6, lat:-25.3, lng:133.8},
  {n:'Mexique',            r:'Initiatives sectorielles',          s:3.5, lat:23.6,  lng:-102.6},
  {n:'Afrique du Sud',     r:'National AI Plan + POPIA',         s:3.5, lat:-28.5, lng:24.7},
  {n:'Nigéria',            r:'National AI Strategy 2024',        s:2.5, lat:9.1,   lng:8.7},
];

function c(s){ return s>=8?'#B83222':s>=5?'#C47C1A':'#2D7A47'; }

GEO.forEach(function(g){
  var mk = L.circleMarker([g.lat,g.lng],{
    radius: 6+g.s*1.1,
    fillColor: c(g.s),
    color: '#fff',
    weight: 1.5,
    fillOpacity: 0.85
  }).addTo(map);

  var lbl = g.s>=8?'Très strict':g.s>=5?'Modéré':'Souple';
  mk.bindPopup(
    '<div class="pn">'+g.n+'</div>'
    +'<div class="pr">'+g.r+'</div>'
    +'<div class="ps" style="color:'+c(g.s)+'">'+g.s
    +'<span style="font-size:12px;color:#A8A8A8">/10</span></div>'
    +'<div class="pl">'+lbl+'</div>',
    {maxWidth:240}
  );
});
</script>
</body>
</html>
