; POURQUOI CE FICHIER EXISTE : `pytest` LANCÉ À LA RACINE NE COLLECTAIT PLUS RIEN.
;
; Ce dépôt contient une copie miroir de conseilprevinfo, sous `conseilprevinfo/`,
; avec sa propre suite. Deux fichiers y portent le même nom de base que les
; nôtres — `tests/test_compression.py` de part et d'autre. Aucun des deux
; dossiers `tests/` n'a d'`__init__.py` : pytest nomme alors le module d'après
; son seul nom de fichier, les deux revendiquent `test_compression`, et la
; collecte s'interrompt :
;
;     import file mismatch:
;     imported module 'test_compression' has this __file__ attribute:
;       /home/user/conseilprev/conseilprevinfo/tests/test_compression.py
;     which is not the same as the test file we want to collect:
;       /home/user/conseilprev/tests/test_compression.py
;     Interrupted: 1 error during collection
;
; CE QUE CELA COÛTAIT. La collecte s'arrête AVANT d'exécuter quoi que ce soit :
; `pytest` à la racine ne renvoyait pas « quelques échecs », il ne renvoyait
; aucun résultat. Il fallait savoir taper `pytest tests/` — un savoir qui ne
; s'écrit nulle part et que la prochaine personne n'a pas.
;
; CE QUE `testpaths` FAIT. Il fixe ce que `pytest` sans argument va chercher :
; la suite de CE dépôt. La suite du miroir reste exécutable en la nommant
; (`pytest conseilprevinfo/tests`), ce qui est la bonne façon de la lancer —
; elle a ses propres attentes et son propre `app.py`.
[pytest]
testpaths = tests
norecursedirs = conseilprevinfo .git __pycache__ node_modules uploads_cv
