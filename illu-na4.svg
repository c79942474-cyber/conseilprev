<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img"
     aria-labelledby="t4 d4" preserveAspectRatio="xMidYMid meet">
  <title id="t4">Deux marques, deux destinataires</title>
  <desc id="d4">Un contenu porte une mention visible pour un lecteur et une
  trame lisible par machine ; seule la seconde se vérifie à grande échelle.</desc>
  <defs>
    <pattern id="tr4" width="16" height="16" patternUnits="userSpaceOnUse"
             patternTransform="rotate(28)">
      <path d="M0 8h16" stroke="#e6c65a" stroke-opacity=".5" stroke-width="1.4"/>
    </pattern>
  </defs>
  <!-- La feuille : ce que le lecteur voit. -->
  <rect x="96" y="52" width="212" height="196" rx="6" fill="rgba(255,255,255,.03)"
        stroke="rgba(240,236,255,.45)" stroke-width="2"/>
  <path d="M124 92h156M124 116h156M124 140h122M124 164h156M124 188h96"
        stroke="rgba(240,236,255,.32)" stroke-width="3" stroke-linecap="round"/>
  <rect x="124" y="212" width="72" height="20" rx="4" fill="none"
        stroke="#e6c65a" stroke-width="1.6"/>
  <text x="160" y="226" fill="#e6c65a" font-family="Georgia,serif" font-size="11.5"
        text-anchor="middle" letter-spacing="1">IA</text>
  <text x="202" y="272" fill="rgba(240,236,255,.75)" font-family="Georgia,serif"
        font-size="13.5" text-anchor="middle">visible — pour un humain</text>
  <!-- La même feuille, révélée : la trame que seule une machine lit. -->
  <rect x="404" y="52" width="212" height="196" rx="6" fill="url(#tr4)"
        stroke="rgba(240,236,255,.45)" stroke-width="2"/>
  <path d="M432 92h156M432 116h156M432 140h122M432 164h156M432 188h96"
        stroke="rgba(240,236,255,.22)" stroke-width="3" stroke-linecap="round"/>
  <text x="510" y="272" fill="rgba(240,236,255,.75)" font-family="Georgia,serif"
        font-size="13.5" text-anchor="middle">lisible — par une machine</text>
  <!-- La loupe : l'outil tiers, sans lequel la seconde marque ne vaut rien. -->
  <circle cx="626" cy="118" r="46" fill="none" stroke="#e6c65a" stroke-width="2.5"/>
  <path d="M660 152l38 38" stroke="#e6c65a" stroke-width="3" stroke-linecap="round"/>
  <path d="M604 118h44M604 106h44M604 130h30" stroke="#e6c65a" stroke-opacity=".75"
        stroke-width="1.6"/>
  <text x="662" y="226" fill="rgba(240,236,255,.6)" font-family="Georgia,serif"
        font-size="12.5" text-anchor="middle">détectable</text>
  <text x="662" y="244" fill="rgba(240,236,255,.6)" font-family="Georgia,serif"
        font-size="12.5" text-anchor="middle">par un tiers</text>
  <!-- ET C'EST LE POINT DE L'ARTICLE : une marque qu'aucun tiers ne sait lire
       ne produit aucune transparence. La flèche va donc de la trame vers la
       loupe, jamais l'inverse. -->
  <path d="M338 150h48" stroke="rgba(240,236,255,.4)" stroke-width="2"
        marker-end="url(#f4)"/>
  <defs><marker id="f4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6"
        markerHeight="6" orient="auto"><path d="M0 0l10 5-10 5z"
        fill="rgba(240,236,255,.4)"/></marker></defs>
</svg>
