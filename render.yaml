# DÉPLOIEMENT SUR RENDER.
#
# LA RÉGION N'ÉTAIT PAS DÉCLARÉE, ET ELLE NE L'EST JAMAIS PAR DÉFAUT. Render
# place alors le service en Oregon (côte ouest des États-Unis). Les visiteurs
# de ce cabinet sont européens : chaque aller-retour vers le serveur leur coûte
# environ 150 ms de plus qu'un service en Europe, et une page en demande
# plusieurs avant d'afficher quoi que ce soit. C'est l'écart qui se ressent
# entre i-aes.eu (ce service) et i-aes.com (conseilprevcyber, déclaré à
# Francfort depuis toujours), à contenu comparable.
#
# CE QUE CETTE LIGNE FAIT, ET CE QU'ELLE NE FAIT PAS. Render fixe la région à
# la CRÉATION du service ; elle ne déplace pas un service existant. Déclarée
# ici, elle vaut pour la prochaine recréation — et, en attendant, elle dit noir
# sur blanc où ce service DEVRAIT être, au lieu de laisser un défaut implicite
# décider à sa place. Pour la rendre effective tout de suite, il faut recréer
# le Web Service à Francfort et rebasculer le domaine ; le déplacement ne peut
# pas se faire depuis ce fichier.
services:
  - type: web
    # LE NOM NE DÉSIGNAIT AUCUN SERVICE VIVANT, ET C'EST CE QUI A FABRIQUÉ LE
    # DOUBLON. Les services de ce dépôt s'appellent `conseilprevIA`,
    # `conseilprev-k8k5` et `conseilprevinfo` ; le nom `conseilprev` est celui
    # d'un CRON JOB. Lors d'une synchronisation, Render ne trouvait donc aucun
    # service web à adopter sous ce nom, en créait un neuf, et lui accolait un
    # suffixe aléatoire parce que le nom était déjà pris : c'est ainsi que sont
    # nés `conseilprev-k8k5` et `conseilprev-registre-db-k8k5`, le 18 juillet
    # 2026 à une minute d'intervalle. Le service a été suspendu le 4 septembre ;
    # sans cette correction, la synchronisation suivante en aurait fabriqué un
    # troisième.
    name: conseilprevIA
    region: frankfurt
    plan: standard
    env: python
    buildCommand: pip install -r requirements.txt
    # LA COMMANDE DE DÉMARRAGE EST CELLE QUI TOURNE, pas une variante. Faire
    # correspondre le nom rend le service ADOPTABLE par une synchronisation —
    # et un fichier qui déclarerait autre chose que le réel écraserait alors le
    # réel. Celle-ci était sur le point de le faire : elle omettait
    # `--workers 2` (le service serait retombé à un seul processus) et fixait
    # le délai à 90 s au lieu de 120 s. Relevé sur le service le 4 septembre
    # 2026 ; le `plan: standard` ci-dessus est déclaré pour la même raison, un
    # plan absent pouvant faire redescendre le service d'un cran.
    startCommand: gunicorn app:app --worker-class gthread --workers 2 --threads 8 --timeout 120 --keep-alive 5

    # LA SONDE DE VIE, ET POURQUOI CE N'EST PAS `/api/health`. `/api/health`
    # est un diagnostic d'exploitant : 3,6 Ko de HTML, qui va vérifier la
    # configuration SMTP et les clés d'API. Interrogé toutes les quelques
    # secondes, il coûte pour rien — et surtout il ferait déclarer le service
    # en panne pour une clé absente, alors qu'il sert parfaitement les pages.
    # `/health` ne répond qu'à la seule question qui vaut ici : ce processus
    # peut-il encore servir une requête.
    #
    # C'EST LA SEULE LIGNE QUI DIFFÈRE VOLONTAIREMENT DU RÉEL, et elle est
    # signalée plutôt que glissée : le service n'a AUCUNE sonde de vie
    # configurée à ce jour (relevé du 4 septembre 2026). Une synchronisation en
    # ajouterait donc une — ce qui est un gain, Render redémarrant alors une
    # instance qui ne répond plus au lieu de la laisser servir des erreurs.
    # Tout le reste de ce bloc décrit ce qui tourne ; celle-ci décrit ce qui
    # devrait tourner, et le dit.
    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # CE FICHIER DÉSIGNAIT LA MAUVAISE BASE, ET C'ÉTAIT UN PIÈGE ARMÉ.
      # Le 27 août 2026 à 9 h 07, une nouvelle base de registre a été créée
      # (`conseilprevia-registre-db`) et le service a basculé dessus depuis le
      # tableau de bord — la précédente a cessé d'être écrite six minutes plus
      # tôt. Ce fichier, lui, continuait de désigner l'ancienne : une
      # resynchronisation du blueprint aurait rebasculé le service dessus et
      # fait disparaître d'un coup tout ce qui s'est écrit depuis. Corrigé ici
      # pour que le fichier dise ce qui EST, et non ce qui était.
      - key: DATABASE_URL
        fromDatabase:
          name: conseilprevia-registre-db
          property: connectionString

      # L'ANCIENNE BASE, EN LECTURE, LE TEMPS DE LA REPRISE.
      # La base de connaissance de l'assistant — 49 documents et leurs
      # fragments indexés — est restée sur `conseilprev-registre-db` le jour de
      # la bascule. L'assistant répond donc en production sans aucun ancrage
      # documentaire. `outils/reprise_registre.py` recopie ce qui manque, sans
      # jamais écraser une ligne vivante ; il lui faut l'adresse de la source.
      #
      # ELLE PASSE PAR `fromDatabase` ET NON PAR UNE VALEUR ÉCRITE ICI : Render
      # injecte la chaîne de connexion lui-même, personne ne manipule le mot de
      # passe, et rien de secret n'entre dans ce dépôt.
      #
      # À RETIRER UNE FOIS LA REPRISE FAITE ET VÉRIFIÉE. Une variable qui ouvre
      # une seconde base n'a pas à survivre au besoin qui l'a créée.
      - key: REGISTRE_ANCIEN_URL
        fromDatabase:
          name: conseilprev-registre-db
          property: connectionString

      # LA CLÉ QUI SIGNE LES SESSIONS. Elle n'était définie NULLE PART — ni
      # ici, ni dans le tableau de bord — et l'application se rabattait sur une
      # constante écrite en clair dans app.py, donc calculable par quiconque lit
      # ce dépôt. Un cookie de session Flask est signé, pas chiffré : cette
      # constante permettait de s'en fabriquer un pour n'importe quel compte,
      # accès administrateur compris.
      #
      # `generateValue` demande à Render un secret aléatoire, posé une fois et
      # conservé ensuite. Comme tout ce fichier, il ne vaut qu'à la CRÉATION du
      # service : sur le service existant, la variable doit être ajoutée à la
      # main dans le tableau de bord. Tant qu'elle manque, le code dérive une
      # clé de DATABASE_URL et le journal le dit à chaque démarrage.
      - key: FLASK_SECRET_KEY
        generateValue: true

# LA BASE N'EST PAS DÉPLACÉE ICI, ET C'EST DÉLIBÉRÉ. Le réseau privé de Render
# ne franchit pas les régions : un service à Francfort ne peut pas joindre par
# `connectionString` interne une base restée en Oregon. Avant toute recréation
# du Web Service à Francfort, il faut donc VÉRIFIER dans le tableau de bord où
# se trouve réellement `conseilprev-registre-db` — ce fichier ne le dit pas, et
# l'écrire ici sans l'avoir constaté serait une supposition présentée comme un
# fait. Si elle est ailleurs, elle se recrée à Francfort et se restaure AVANT
# la bascule.
#
# La région n'est pas ajoutée à ce bloc pour la même raison qu'elle ne déplace
# pas le service : Render la fixe à la création. L'ajouter à une base en
# service ne la déplacerait pas et ferait seulement échouer la synchronisation
# du blueprint sur une propriété immuable.
# CE BLOC NE DÉCRIVAIT AUCUNE BASE EXISTANTE. Il annonçait
# `conseilprev-registre-db` avec `databaseName: registre_ia` et
# `user: conseilprev` — or la base qui porte ce nom a pour base
# `conseilprev_registre_db` et pour utilisateur
# `conseilprev_registre_db_user`. Les valeurs déclarées ici étaient celles
# d'une TROISIÈME base, `conseilprev-registre-db-k8k5`, en Oregon et
# suspendue. Un blueprint qui décrit une base qui n'est pas celle qu'il nomme
# est pire qu'un blueprint muet : il donne l'apparence d'une infrastructure
# décrite.
#
# Les deux bases sont donc déclarées telles qu'elles sont, relevées le
# 4 septembre 2026 dans le tableau de bord.
databases:
  - name: conseilprevia-registre-db
    plan: basic-256mb
    databaseName: conseilprevia_registre_db
    user: conseilprevia_registre_db_user

  # Conservée le temps de la reprise, puis à suspendre et à supprimer.
  - name: conseilprev-registre-db
    plan: basic-256mb
    databaseName: conseilprev_registre_db
    user: conseilprev_registre_db_user
