<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img"
     aria-labelledby="t1 d1" preserveAspectRatio="xMidYMid meet">
  <title id="t1">Un calendrier réaménagé, des obligations maintenues</title>
  <desc id="d1">Trois échéances de systèmes à haut risque se décalent vers la
  droite ; la transparence, elle, ne bouge pas.</desc>
  <path d="M80 92h640M80 168h640M80 244h640" stroke="rgba(240,236,255,.18)"
        stroke-width="1.5"/>
  <!-- CE QUI SE DÉCALE — et le dessin montre d'où vers où, sans quoi « report »
       ne dit rien. -->
  <g stroke="rgba(240,236,255,.35)" stroke-width="2" stroke-dasharray="5 5">
    <path d="M214 92h226"/><path d="M214 168h330"/>
  </g>
  <circle cx="214" cy="92" r="7" fill="none" stroke="rgba(240,236,255,.35)" stroke-width="2"/>
  <circle cx="214" cy="168" r="7" fill="none" stroke="rgba(240,236,255,.35)" stroke-width="2"/>
  <circle cx="452" cy="92" r="9" fill="#e6c65a"/>
  <circle cx="556" cy="168" r="9" fill="#e6c65a"/>
  <text x="200" y="80" fill="rgba(240,236,255,.45)" font-family="Georgia,serif"
        font-size="12.5" text-anchor="end">annexe III</text>
  <text x="200" y="156" fill="rgba(240,236,255,.45)" font-family="Georgia,serif"
        font-size="12.5" text-anchor="end">annexe I</text>
  <text x="470" y="80" fill="rgba(240,236,255,.9)" font-family="Georgia,serif"
        font-size="14">2 décembre 2027</text>
  <text x="574" y="156" fill="rgba(240,236,255,.9)" font-family="Georgia,serif"
        font-size="14">2 août 2028</text>
  <!-- CE QUI NE BOUGE PAS, et c'est le point : la transparence reste au 2 août
       2026. Un report qui ferait croire à une pause générale se lirait de
       travers. -->
  <circle cx="214" cy="244" r="9" fill="#e6c65a"/>
  <text x="200" y="232" fill="rgba(240,236,255,.45)" font-family="Georgia,serif"
        font-size="12.5" text-anchor="end">transparence</text>
  <text x="232" y="232" fill="rgba(240,236,255,.9)" font-family="Georgia,serif"
        font-size="14">2 août 2026 — inchangé</text>
  <rect x="196" y="226" width="252" height="36" rx="18" fill="none"
        stroke="#e6c65a" stroke-width="1.6" stroke-opacity=".7"/>
</svg>
